services:
  package-manager:
    override: replace
    command: /usr/local/bin/startup.sh
    startup: enabled
    # Pebble exits when the service does, so the container follows PPM's lifecycle.
    on-success: shutdown
    on-failure: shutdown
    # Pebble's default is 5s before SIGKILL; PPM needs longer to stop cleanly and
    # startup.sh needs time to deactivate the license.
    kill-delay: 30s
