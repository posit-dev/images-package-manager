user:
  rstudio-pm:
    exists: true
    uid: 999
    gid: 999

group:
  rstudio-pm:
    exists: true
    gid: 999

package:
  rstudio-pm:
    installed: true

process:
  rstudio-pm:
    running: true
    skip: {{ if eq .Env.IMAGE_TYPE "min" }}true{{ else }}false{{ end }}

port:
  tcp6:4242:
    listening: true
    skip: {{ if eq .Env.IMAGE_TYPE "min" }}true{{ else }}false{{ end }}

file:
  /etc/rstudio-pm/license.lic:
# Currently does not exist
# Be sure it is NOT a directory
    exists: false
  /opt/rstudio-pm/:
    exists: true
  /opt/rstudio-pm/bin/rstudio-pm:
    exists: true
  /opt/rstudio-pm/bin/rspm:
    exists: true
  /usr/local/bin/rspm:
    exists: true
  /usr/local/bin/tini:
    exists: true
  
  # Check for R installation
  /opt/R/4.4.0/bin/R:
    exists: {{ if eq .Env.IMAGE_TYPE "std" }}true{{ else }}false{{ end }}
    filetype: file
  /opt/R/default/bin/R:
    exists: {{ if eq .Env.IMAGE_TYPE "std" }}true{{ else }}false{{ end }}
    filetype: file
  /usr/local/bin/R:
    exists: {{ if eq .Env.IMAGE_TYPE "std" }}true{{ else }}false{{ end }}
    filetype: symlink
  /usr/local/bin/Rscript:
    exists: {{ if eq .Env.IMAGE_TYPE "std" }}true{{ else }}false{{ end }}
    filetype: symlink
  # Check for Python installation
  /opt/python/3.12.1/bin/python:
    exists: {{ if eq .Env.IMAGE_TYPE "std" }}true{{ else }}false{{ end }}
  /opt/python/default/bin/python:
    exists: {{ if eq .Env.IMAGE_TYPE "std" }}true{{ else }}false{{ end }}

command:
  "Ensure Package Manager version is correct":
    exec: /opt/rstudio-pm/bin/rstudio-pm --version
    exit-status: 0
    stdout:
      - "2024.04.4-35"
  "Ensure Package Manager is running":
    exec: pgrep rstudio-pm
    exit-status: 0
  "Ensure R version is correct":
    exec: /opt/R/4.4.0/bin/R --version
    exit-status: 0
    stdout:
      - "4.4.0"
    skip: {{ if eq .Env.IMAGE_TYPE "min" }}true{{ else }}false{{ end }}
  "Ensure Python version is correct":
    exec: /opt/python/3.12.1/bin/python --version
    exit-status: 0
    stdout:
      - "3.12.1"
    skip: {{ if eq .Env.IMAGE_TYPE "min" }}true{{ else }}false{{ end }}