user:
  rstudio-pm:
    exists: true
    uid: 999
    gid: 999

group:
  rstudio-pm:
    exists: true
    gid: 999

package:
  rstudio-pm:
    installed: true

process:
  rstudio-pm:
    running: true
    skip: {{ if eq .Env.IMAGE_VARIANT "Minimal" }}true{{ else }}false{{ end }}

port:
  tcp6:4242:
    listening: true
    skip: {{ if eq .Env.IMAGE_VARIANT "Minimal" }}true{{ else }}false{{ end }}

file:
  /etc/rstudio-pm/license.lic:
# Currently does not exist
# Be sure it is NOT a directory
    exists: false
  /opt/rstudio-pm/:
    exists: true
  /opt/rstudio-pm/bin/rstudio-pm:
    exists: true
  /opt/rstudio-pm/bin/rspm:
    exists: true
  /usr/local/bin/rspm:
    exists: true
  
  # Check for R installation
  /opt/R/4.4.0/bin/R:
    exists: {{ if eq .Env.IMAGE_VARIANT "Standard" }}true{{ else }}false{{ end }}
    filetype: file
  # Check for Python installation
  /opt/python/cpython-3.12.1-linux-x86_64-gnu/bin/python:
    exists: {{ if eq .Env.IMAGE_VARIANT "Standard" }}true{{ else }}false{{ end }}
  /etc/rstudio-pm/rstudio-pm.gcfg:
    exists: true
    filetype: file
    {{ if eq .Env.IMAGE_VARIANT "Standard" }}
    contents:
      - RVersion = /opt/R/4.4.0
      - PythonVersion = /opt/python/cpython-3.12.1-linux-x86_64-gnu/bin/python
    {{ end }}

command:
  "Ensure Package Manager version is correct":
    exec: /opt/rstudio-pm/bin/rstudio-pm --version
    exit-status: 0
    stdout:
      - "2024.04.4-35"
  "Ensure R version is correct":
    exec: /opt/R/4.4.0/bin/R --version
    exit-status: 0
    stdout:
      - "4.4.0"
    skip: {{ if eq .Env.IMAGE_VARIANT "Minimal" }}true{{ else }}false{{ end }}
  "Ensure Python version is correct":
    exec: /opt/python/cpython-3.12.1-linux-x86_64-gnu/bin/python --version
    exit-status: 0
    stdout:
      - "3.12.1"
    skip: {{ if eq .Env.IMAGE_VARIANT "Minimal" }}true{{ else }}false{{ end }}
