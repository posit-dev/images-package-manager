user:
  rstudio-pm:
    exists: true
    uid: 999
    gid: 999

group:
  rstudio-pm:
    exists: true
    gid: 999

package:
  rstudio-pm:
    installed: true

process:
  rstudio-pm:
    running: true
    skip: {{ if eq .Env.IMAGE_TYPE "min" }}true{{ else }}false{{ end }}

port:
  tcp6:4242:
    listening: true
    skip: {{ if eq .Env.IMAGE_TYPE "min" }}true{{ else }}false{{ end }}

file:
  /etc/rstudio-pm/license.lic:
# Currently does not exist
# Be sure it is NOT a directory
    exists: false
  /opt/rstudio-pm/:
    exists: true
  /opt/rstudio-pm/bin/rstudio-pm:
    exists: true
  /opt/rstudio-pm/bin/rspm:
    exists: true
  /usr/local/bin/rspm:
    exists: true
  /usr/local/bin/tini:
    exists: true
  
  {{ if eq .Env.IMAGE_TYPE "std" }}
  /var/log/rstudio/rstudio-pm/rstudio-pm.log:
    exists: true
    filetype: file
    contents:
      - "Posit Package Manager service is ready"
  {{ end }}
  
  # Check for R installation
  /opt/R/4.5.1/bin/R:
    exists: {{ if eq .Env.IMAGE_TYPE "std" }}true{{ else }}false{{ end }}
    filetype: file
  /opt/R/default/bin/R:
    exists: {{ if eq .Env.IMAGE_TYPE "std" }}true{{ else }}false{{ end }}
    filetype: file
  /usr/local/bin/R4.5.1:
    exists: {{ if eq .Env.IMAGE_TYPE "std" }}true{{ else }}false{{ end }}
    filetype: symlink
  /usr/local/bin/Rscript4.5.1:
    exists: {{ if eq .Env.IMAGE_TYPE "std" }}true{{ else }}false{{ end }}
    filetype: symlink
  # Check for Python installation
  /opt/python/3.13.5/bin/python:
    exists: {{ if eq .Env.IMAGE_TYPE "std" }}true{{ else }}false{{ end }}
  /opt/python/default/bin/python:
    exists: {{ if eq .Env.IMAGE_TYPE "std" }}true{{ else }}false{{ end }}
  /usr/local/bin/python3.13.5:
    exists: {{ if eq .Env.IMAGE_TYPE "std" }}true{{ else }}false{{ end }}
    filetype: symlink
  /usr/local/bin/pip3.13.5:
    exists: {{ if eq .Env.IMAGE_TYPE "std" }}true{{ else }}false{{ end }}
    filetype: symlink

command:
  "Ensure Package Manager version is correct":
    exec: /opt/rstudio-pm/bin/rstudio-pm --version
    exit-status: 0
    stdout:
      - "2025.04.2-8"
  "Ensure R version is correct":
    exec: /opt/R/4.5.1/bin/R --version
    exit-status: 0
    stdout:
      - "4.5.1"
    skip: {{ if eq .Env.IMAGE_TYPE "min" }}true{{ else }}false{{ end }}
  "Ensure Python version is correct":
    exec: /opt/python/3.13.5/bin/python --version
    exit-status: 0
    stdout:
      - "3.13.5"
    skip: {{ if eq .Env.IMAGE_TYPE "min" }}true{{ else }}false{{ end }}
