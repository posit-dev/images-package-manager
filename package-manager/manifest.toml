[const]
image_name = "package-manager"

[[build]]
version = "2024.08.2-9"
os = ["Ubuntu 22.04"]
latest = true

[[build]]
version = "2024.08.0-6"
os = ["Ubuntu 22.04"]

[[build]]
version = "2024.04.4-35"
os = ["Ubuntu 22.04"]

[[target]]
type = "min"
tags = ["{{ build.version | tag_safe }}-{{ build.os | condense }}-min", "{{ build.version | clean_version }}-{{ build.os | condense }}-min"]
latest_tags = ["{{ build.os | condense }}-latest-min", "latest-min"]

[[target]]
type = "std"
tags = ["{{ build.version | tag_safe }}-{{ build.os | condense }}", "{{ build.version | clean_version }}-{{ build.os | condense }}"]
latest_tags = ["{{ build.os | condense }}-latest", "latest"]
[target.goss]
command = "/opt/rstudio-pm/bin/rstudio-pm --config /etc/rstudio-pm/rstudio-pm.gcfg"
wait = 10
