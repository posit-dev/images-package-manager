user:
  rstudio-pm:
    exists: true
    uid: 999
    gid: 999

group:
  rstudio-pm:
    exists: true
    gid: 999

package:
  rstudio-pm:
    installed: true

process:
  rstudio-pm:
    running: true
    skip: {{ if eq .Env.IMAGE_VARIANT "Minimal" }}true{{ else }}false{{ end }}

port:
  tcp6:4242:
    listening: true
    skip: {{ if eq .Env.IMAGE_VARIANT "Minimal" }}true{{ else }}false{{ end }}

file:
  /etc/rstudio-pm/license.lic:
# Currently does not exist
# Be sure it is NOT a directory
    exists: false
  /opt/rstudio-pm/:
    exists: true
  /opt/rstudio-pm/bin/rstudio-pm:
    exists: true
  /opt/rstudio-pm/bin/rspm:
    exists: true
  /usr/local/bin/rspm:
    exists: true
  /usr/local/bin/tini:
    exists: true

  {{ if eq .Env.IMAGE_VARIANT "Standard" }}
  /var/log/rstudio/rstudio-pm/rstudio-pm.log:
    exists: true
    filetype: file
    contents:
      - "Posit Package Manager service is ready"
  {{ end }}

  # Check for R installation
  /opt/R/4.4.2/bin/R:
    exists: {{ if eq .Env.IMAGE_VARIANT "Standard" }}true{{ else }}false{{ end }}
    filetype: file
  /opt/R/default/bin/R:
    exists: {{ if eq .Env.IMAGE_VARIANT "Standard" }}true{{ else }}false{{ end }}
    filetype: file
  /usr/local/bin/R4.4.2:
    exists: {{ if eq .Env.IMAGE_VARIANT "Standard" }}true{{ else }}false{{ end }}
    filetype: symlink
  /usr/local/bin/Rscript4.4.2:
    exists: {{ if eq .Env.IMAGE_VARIANT "Standard" }}true{{ else }}false{{ end }}
    filetype: symlink
  # Check for Python installation
  /opt/python/3.12.8/bin/python:
    exists: {{ if eq .Env.IMAGE_VARIANT "Standard" }}true{{ else }}false{{ end }}
  /opt/python/default/bin/python:
    exists: {{ if eq .Env.IMAGE_VARIANT "Standard" }}true{{ else }}false{{ end }}
  /usr/local/bin/python3.12.8:
    exists: {{ if eq .Env.IMAGE_VARIANT "Standard" }}true{{ else }}false{{ end }}
    filetype: symlink
  /usr/local/bin/pip3.12.8:
    exists: {{ if eq .Env.IMAGE_VARIANT "Standard" }}true{{ else }}false{{ end }}
    filetype: symlink

command:
  "Ensure Package Manager version is correct":
    exec: /opt/rstudio-pm/bin/rstudio-pm --version
    exit-status: 0
    stdout:
      - "2024.11.0-7"
  "Ensure R version is correct":
    exec: /opt/R/4.4.2/bin/R --version
    exit-status: 0
    stdout:
      - "4.4.2"
    skip: {{ if eq .Env.IMAGE_VARIANT "Minimal" }}true{{ else }}false{{ end }}
  "Ensure Python version is correct":
    exec: /opt/python/3.12.8/bin/python --version
    exit-status: 0
    stdout:
      - "3.12.8"
    skip: {{ if eq .Env.IMAGE_VARIANT "Minimal" }}true{{ else }}false{{ end }}
