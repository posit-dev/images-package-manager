name: Development

on:
  workflow_dispatch:

  schedule:
    # Hourly rebuild of dev images
    - cron: "45 * * * *" # At minute 45 past every hour

  pull_request:

  push:
    branches:
      - main

concurrency:
  # Only cancel in-progress runs for pull_request events, this prevents cancelling workflows against main or tags
  # A pull_request will reuse the same group thus enabling cancelation, all others receive a unique run_id
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    # Use this job for branch protection status checks.
    if: always()
    runs-on: ubuntu-latest
    needs:
      - dev
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  dev:
    name: Build
    # Dev Build
    #
    # Builds all development versions of each image in parallel.
    #
    # Run on merges to main, or on hourly scheduled re-builds.
    permissions:
      contents: read
      packages: write
      id-token: write  # Required for AWS OIDC login

    uses: "posit-dev/images-shared/.github/workflows/bakery-build-native.yml@cache-tag"
    secrets:
      AWS_ROLE: ${{ secrets.AWS_ROLE }}
    with:
      version: "cache-tag"
      dev-versions: "only"
      # Push images only for merges into main and hourly schduled re-builds.
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}

  update-helm:
    name: Update Helm Charts
    # Trigger the helm-package-manager workflow to update charts with the new dev image.
    # Only runs when dev images were actually pushed.
    if: needs.dev.result == 'success' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'schedule')
    needs:
      - dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install bakery
        uses: "posit-dev/images-shared/setup-bakery@cache-tag"

      - name: Trigger helm-package-manager workflow
        env:
          GH_TOKEN: ${{ secrets.HELM_DISPATCH_TOKEN }}
        run: |
          bakery ci matrix --quiet --dev-versions only --exclude platform | jq -c '.[]' | while read -r entry; do
            VERSION=$(echo "$entry" | jq -r '.version')
            # Make version tag-safe (replace + with -)
            TAG=$(echo "$VERSION" | tr '+' '-')

            gh workflow run arbitrary-deploy.yml \
              -R rstudio/helm-package-manager \
              --field ppm-image-version="$TAG" \
              --field ppm-image-repository="528395739535.dkr.ecr.us-east-2.amazonaws.com/package-manager-preview"
          done

  clean:
    name: Clean
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    needs:
      - dev

    uses: "posit-dev/images-shared/.github/workflows/clean.yml@main"
    with:
      remove-dangling-caches: true
      remove-caches-older-than: 14
      remove-dangling-temporary-images: false
      remove-temporary-images-older-than: 3
