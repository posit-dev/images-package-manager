name: Production

on:
  workflow_dispatch:

  schedule:
    # Weekly rebuild of all images, to pick up any upstream changes.
    # Staggered with images-connect production (02:15 Sun) and
    # images-workbench production (03:15 Sun) so the three products
    # don't all build in the same hour.
    - cron: "15 1 * * 0" # At 01:15 on Sunday

  push:
    branches:
      - main


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    # Use this job for branch protection status checks.
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - build
      - update-helm
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe  # v1.2.2
        id: alls-green
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: update-helm
      - if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: posit-dev/images-shared/.github/actions/slack-build-notify@main
        with:
          result: ${{ steps.alls-green.outcome }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Jobs that call a reusable workflow via `uses:` can't also set
  # `environment:`, so the branch restriction lives in its own job and
  # build depends on it.
  main-only:
    name: Main Only
    runs-on: ubuntu-latest
    permissions: {}
    environment: production
    steps:
      - run: echo "Branch allowed by environment policy."

  build:
    name: Build
    # Build all images, excluding dev versions.
    #
    # Builds all versions of each image in parallel.
    #
    # Run on merges to main, or on weekly scheduled re-builds.
    needs:
      - main-only
    permissions:
      contents: read
      packages: write

    uses: "posit-dev/images-shared/.github/workflows/bakery-build-native.yml@main"
    secrets:
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      DOCKER_HUB_README_USERNAME: ${{ secrets.DOCKER_HUB_README_USERNAME }}
      DOCKER_HUB_README_PASSWORD: ${{ secrets.DOCKER_HUB_README_PASSWORD }}
      WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
      WIZ_POLICY_ID: ${{ secrets.WIZ_POLICY_ID }}
      WIZ_PROJECT_ID: ${{ secrets.WIZ_PROJECT_ID }}
    with:
      dev-versions: "exclude"
      # Push images only for merges into main and weekly schduled re-builds.
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

  update-helm:
    name: Update Helm
    if: ${{ needs.build.result == 'success' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install bakery
        uses: posit-dev/images-shared/setup-bakery@main

      - name: Get latest version
        id: version
        run: |
          APP_VERSION=$(bakery get version package-manager)
          APP_VERSION="${APP_VERSION%%[+-]*}"
          echo "app-version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.PPM_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.PPM_AUTOMATION_PEM }}
          owner: rstudio
          repositories: helm
          permission-actions: write

      - name: Dispatch Helm update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_VERSION: ${{ steps.version.outputs.app-version }}
        run: |
          gh workflow run product-release.yml \
            --repo rstudio/helm \
            --field product=package-manager \
            --field version="$APP_VERSION"
