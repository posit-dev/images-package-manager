name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Product version (e.g. 2026.01.0-15)"
        required: true
        type: string


jobs:
  # Jobs that call a reusable workflow via `uses:` can't also set
  # `environment:`, so the branch restriction lives in its own job and
  # release depends on it.
  main-only:
    name: Main Only
    runs-on: ubuntu-latest
    permissions: {}
    environment: production
    steps:
      - run: echo "Branch allowed by environment policy."

  release:
    needs:
      - main-only
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    uses: posit-dev/images-shared/.github/workflows/product-release.yml@main
    with:
      version: ${{ inputs.version }}
      images: "package-manager"
    secrets:
      APP_ID: ${{ secrets.PPM_AUTOMATION_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.PPM_AUTOMATION_PEM }}
