name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Product version (e.g. 2026.01.0-15)"
        required: true
        type: string


jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    uses: posit-dev/images-shared/.github/workflows/product-release.yml@main
    with:
      version: ${{ inputs.version }}
      images: "package-manager"
    secrets:
      CLIENT_ID: ${{ secrets.PPM_AUTOMATION_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.PPM_AUTOMATION_PEM }}
