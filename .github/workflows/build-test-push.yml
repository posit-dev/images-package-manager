on:
  pull_request:
  push:
    branches:
      - main

name: Build, Test, and Push
jobs:
  ubuntu:
    env:
      image-name: 'ubuntu'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Install Posit Bakery
        uses: rstudio/posit-images-shared/setup-posit-bakery@toml-manifest

      - name: Install goss and dgoss
        uses: rstudio/posit-images-shared/setup-goss@toml-manifest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        env:
          GIT_SHA: ${{ github.sha }}
        run: bakery build --load

      - name: Test images
        run: bakery dgoss

      - name: Push images
        env:
          GIT_SHA: ${{ github.sha }}
        if: github.event_name == 'push'
        run: bakery build --push
