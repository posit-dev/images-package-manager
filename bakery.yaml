#######################################################################################################################
# BAKERY REPOSITORY CONFIG
#
# This file is used to define global properties for builds inside a repo managed by Posit's Bakery tool.
#######################################################################################################################

# Define properties of the local repository. This information will be used when labeling image builds.
repository:
  url: "github.com/posit-dev/images-package-manager"
  vendor: "Posit Software, PBC"
  maintainer: "Posit Docker Team <docker@posit.co>"
  authors:
    - name: Ian H. Pittwood
      email: ian.pittwood@posit.co
    - name: Ben Schwedler
      email: ben@posit.co

# Define image registries used by builds in this repository. Images will be tagged appropriately for each registry.
# Logins for private registries should be managed independently of Bakery.
registries:
  - host: "docker.io"
    namespace: "posit"
  - host: "ghcr.io"
    namespace: "posit-dev"

images:
  - name: package-manager
    displayName: "Posit Package Manager"
    description: "A containerized image of Posit Package Manager (PPM), which organizes
      and centralizes data science packages across your team, department, or the entire
      organization."
    documentationUrl: https://docs.posit.co/rspm/
    dependencyConstraints:
      - dependency: R
        constraint:
          latest: true
      - dependency: python
        constraint:
          latest: true
    devVersions:
      - sourceType: "stream"
        product: "package-manager"
        stream: "preview"
        os:
          - name: Ubuntu 24.04
            primary: true
            platforms:
              - linux/amd64
              - linux/arm64
          - name: Ubuntu 22.04
        overrideRegistries:
          - host: "ghcr.io"
            namespace: "posit-dev"
            repository: "package-manager-preview"
      - sourceType: "stream"
        product: "package-manager"
        stream: "daily"
        os:
          - name: Ubuntu 24.04
            primary: true
            platforms:
              - linux/amd64
              - linux/arm64
          - name: Ubuntu 22.04
        overrideRegistries:
          - host: "ghcr.io"
            namespace: "posit-dev"
            repository: "package-manager-preview"
    variants:
      - name: Standard
        extension: std
        tagDisplayName: std
        primary: true
        options:
          - tool: goss
            wait: 10
            command: "/opt/rstudio-pm/bin/rstudio-pm --config /etc/rstudio-pm/rstudio-pm.gcfg"
      - name: Minimal
        extension: min
        tagDisplayName: min
    versions:
      - name: 2026.04.2
        subpath: '2026.04'
        latest: true
        os:
          - name: Ubuntu 22.04
          - name: Ubuntu 24.04
            primary: true
            platforms:
              - linux/amd64
              - linux/arm64
        dependencies:
          - dependency: R
            version: 4.5.3
          - dependency: python
            version: 3.14.4
      - name: 2025.12.0-14
        subpath: '2025.12'
        os:
          - name: Ubuntu 24.04
            primary: true
            platforms:
              - linux/amd64
              - linux/arm64
          - name: Ubuntu 22.04
        dependencies:
          - dependency: R
            version: 4.5.2
          - dependency: python
            version: 3.14.2
      - name: 2025.09.0-7
        subpath: '2025.09'
        os:
          - name: Ubuntu 22.04
            primary: true
          - name: Ubuntu 24.04
        dependencies:
          - dependency: R
            version: 4.5.1
          - dependency: python
            version: 3.13.7
      - name: 2025.04.4-13
        subpath: '2025.04'
        os:
          - name: Ubuntu 22.04
            primary: true
          - name: Ubuntu 24.04
        dependencies:
          - dependency: R
            version: 4.4.3
          - dependency: python
            version: 3.12.11
